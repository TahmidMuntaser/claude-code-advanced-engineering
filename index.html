<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Todo List</h1>

    <div class="form-group">
      <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
      <button type="button" id="addBtn" class="add-btn">Add Task</button>
    </div>

    <ul id="taskList" class="task-list"></ul>

    <div id="emptyState" class="empty-state">No tasks yet. Add one above!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
